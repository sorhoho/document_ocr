[project]
name = "document-ocr"
version = "0.1.0"
description = "Thai scanned document extraction with multi-backend VLM/OCR"
requires-python = ">=3.11"

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # PDF → image
    "pdf2image>=1.17",

    # Image preprocessing
    "opencv-python-headless>=4.9",
    "Pillow>=10.3",
    "numpy>=1.26",

    # OCR (Gemma two-stage fallback)
    "pytesseract>=0.3.13",

    # Self-hosted LLM inference (>=0.4 required for format=dict structured output)
    "ollama>=0.4",

    # Cloud LLM (Gemini + OpenTyphoon API)
    "google-genai>=1.0",
    "openai>=1.30",

    # Evaluation
    "rapidfuzz>=3.9",

    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",

    # CLI
    "typer>=0.12",
    "rich>=13.7",
]

[project.scripts]
docr = "cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["document_ocr", "cli", "api"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
